[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-mblt"
authors = [
    {name = "Mobilint Inc.", email = "tech-support@mobilint.com"},
]
dynamic = ["version"]
description = "An out-of-tree vLLM plugin for Mobilint NPU runtime integration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "vllm",
    "mobilint",
    "mblt",
    "npu",
    "inference",
    "llm",
    "vlm",
    "aries",
]
dependencies = [
    "vllm>=0.32.0,<=0.32.0",
    # The worker keeps one transformers-mblt cache per request (portable caches, 0.3.0) and runs text models through
    # its forward on those caches joined with MobilintCache.from_rows (0.4.0), and EAGLE-3 through its round API
    # (eagle3_prefill / eagle3_decode_step, 0.5.0). The worker sizes its torch thread pool with
    # recommended_host_threads (0.6.1). The Model Zoo release that forwards
    # hf_transformers to transformers-mblt loads the same model classes.
    "mblt-model-zoo[transformers]>=2.11.0",
    "transformers-mblt>=0.7.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Home = "https://www.mobilint.com/"
Repository = "https://github.com/mobilint/vllm-mblt"

[project.optional-dependencies]
# Serving mobilint/Qwen3-ASR-1.7B. transformers-mblt vendors the Qwen3-ASR backend from 0.7.0, which runs on
# transformers 5; the qwen-asr package it replaces pins transformers 4.57.
qwen-asr = [
    "transformers-mblt>=0.7.0",
]
# Serving mobilint/Qwen3-30B-A3B (Mixture-of-Experts). The base requirements now cover it; the extra is kept so
# existing install commands keep working.
qwen3-moe = [
    "transformers-mblt>=0.6.1",
    "mblt-model-zoo[transformers]>=2.11.0",
]

[project.entry-points."vllm.platform_plugins"]
mblt = "vllm_mblt:register"

[project.entry-points."vllm.general_plugins"]
mblt_models = "vllm_mblt:register_model"

[tool.setuptools]
packages = { find = { where = ["."], include = ["vllm_mblt", "vllm_mblt.*"] } }

[tool.setuptools.dynamic]
version = { attr = "vllm_mblt.__version__" }

[dependency-groups]
dev = [
    "build",
    "pytest>=8.0.0",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
